name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Unpack native Android project
        run: unzip -q AmanoCubaAndroid_source.zip -d .

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: AmanoCubaAndroid

      - name: Publish installable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" \
            "AmanoCubaAndroid/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "A Mano Cuba Android ${GITHUB_RUN_NUMBER}" \
            --notes "APK de depuración instalable para pruebas."
